services:
  mihomo:
    image: metacubex/mihomo:latest
    container_name: clash-docker--mihomo
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /config/start-mihomo.sh
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MIHOMO_SECRET: ${MIHOMO_SECRET}
      MIHOMO_CONFIG_URL: ${MIHOMO_CONFIG_URL:-}
      MIHOMO_CONFIG_UPDATE_INTERVAL: ${MIHOMO_CONFIG_UPDATE_INTERVAL:-3600}
    volumes:
      - ./config/mihomo:/config
    ports:
      - "${MIXED_PORT:-17890}:7890"
      - "${CONTROLLER_PORT:-9090}:9090"
    networks:
      - clash_net

  zashboard:
    image: ghcr.io/zephyruso/zashboard:latest
    container_name: clash-docker--zashboard
    restart: unless-stopped
    depends_on:
      - mihomo
    volumes:
      - ./config/zashboard/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    networks:
      - clash_net

  traffic-collector:
    image: library/python:3.12-alpine
    container_name: clash-docker--mihomo-traffic-collector
    restart: unless-stopped
    depends_on:
      - mihomo
    command:
      - python
      - /app/collector.py
      - collect
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MIHOMO_API_URL: http://mihomo:9090
      MIHOMO_SECRET: ${MIHOMO_SECRET}
      TRAFFIC_COLLECTOR_INTERVAL: ${TRAFFIC_COLLECTOR_INTERVAL:-5}
      TRAFFIC_COLLECTOR_DB: /data/traffic.sqlite3
      TRAFFIC_COLLECTOR_RETENTION_DAYS: ${TRAFFIC_COLLECTOR_RETENTION_DAYS:-30}
    volumes:
      - ./collector:/app:ro
      - ./data:/data
    networks:
      - clash_net

networks:
  clash_net:
    driver: bridge
